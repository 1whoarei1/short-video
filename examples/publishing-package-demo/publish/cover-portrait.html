<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>比较增长，先看基期 · 竖版3:4</title>
<style>
*{box-sizing:border-box}html,body{width:1200px;height:1600px;margin:0;overflow:hidden}
body{background:#153d3a;color:#f5f0e5;font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}
.eyebrow{position:absolute;left:104px;top:96px;font-size:28px;letter-spacing:4px;color:#b7c9bb}
h1{position:absolute;left:100px;top:170px;margin:0;font-size:154px;line-height:1.45;letter-spacing:-5px}
.accent{color:#ef9b63}.lead{position:absolute;left:104px;top:650px;margin:0;font-size:33px;color:#e1e5d6}
.diagram{position:absolute;left:105px;top:790px;width:990px;height:485px}
.base{position:absolute;left:0;top:20px;width:640px;height:340px;border:3px solid #9eb7a3;border-radius:18px}
.base-number{position:absolute;left:42px;top:35px;font-size:104px;line-height:1.2;font-weight:700}
.base-label{position:absolute;left:45px;bottom:35px;font-size:35px;color:#b7c9bb}
.added{position:absolute;left:666px;top:20px;width:320px;height:340px;background:#ef9b63;border-radius:18px;color:#153d3a}
.added-number{position:absolute;top:45px;left:48px;font-size:78px;font-weight:800}
.added-label{position:absolute;left:48px;bottom:43px;font-size:32px}
.baseline{position:absolute;left:0;top:387px;width:988px;border-top:3px solid #b7c9bb}
.baseline:before,.baseline:after{content:"";position:absolute;top:-12px;height:22px;border-left:3px solid #b7c9bb}.baseline:after{right:0}
.result{position:absolute;top:422px;left:70px;font-size:43px;font-weight:700;white-space:nowrap}
.footer{position:absolute;left:104px;bottom:101px;font-size:25px;line-height:1.7;color:#b7c9bb}
</style>
<div class="eyebrow">图形里的一个小细节</div>
<h1 data-cover-hook>比较增长<br><span class="accent">先看基期</span></h1>
<p class="lead">把起点留在画面里，百分比才有参照。</p>
<div class="diagram" role="img" aria-label="演示数据：基期100，加上增量50，得到本期150">
  <div class="base"><div class="base-number">100</div><div class="base-label">基期 · 计算的分母</div></div>
  <div class="added"><div class="added-number">+50</div><div class="added-label">增量</div></div>
  <div class="baseline"></div><div class="result">本期150 · 增幅50%</div>
</div>
<div class="footer">演示数据 · 同一套视觉语言<br>竖版独立排列，不裁切横版 · 3:4</div>
</html>

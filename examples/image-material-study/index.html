<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生图素材 + HTML 动画实验</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101e25;color:#e7efea;font-family:system-ui,sans-serif}.stage{position:absolute;width:1280px;height:720px;left:50%;top:50%;transform-origin:center;background:radial-gradient(ellipse at 70% 60%,#52747766,transparent 62%),#101e25;overflow:hidden}.grid{position:absolute;inset:0;background-image:linear-gradient(#aecbcc09 1px,transparent 1px),linear-gradient(90deg,#aecbcc09 1px,transparent 1px);background-size:50px 50px;transform:perspective(500px) rotateX(45deg);transform-origin:bottom}.prism{position:absolute;left:440px;top:35px;width:800px;height:auto;filter:drop-shadow(0 28px 32px #030b1570)}.copy{position:absolute;left:74px;top:165px;z-index:2}small{letter-spacing:4px;color:#94b5b5}h1{font-size:68px;line-height:1.25;font-weight:450;margin:25px 0}p{font-size:20px;line-height:1.7;color:#98b5b7}.footer{position:absolute;bottom:45px;left:74px;font-size:13px;color:#819f9f}.bar{width:220px;height:2px;background:linear-gradient(90deg,#6ae6df,#ffe0a9);margin:32px 0}</style><div class="stage"><div class="grid"></div><img class="prism" src="assets/prism.webp" alt="AI生成的透明玻璃棱镜"><section class="copy"><small>MATERIAL STUDY / 01</small><h1>让素材<br>参与叙事。</h1><div class="bar"></div><p>AI 生成质感与细节<br>HTML 编排空间与运动</p></section><div class="footer">原生生图素材 + 自由 HTML · 无配音 · 概念演绎</div></div><script>const stage=document.querySelector('.stage'),prism=document.querySelector('.prism'),copy=document.querySelector('.copy');const fit=()=>stage.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1280,innerHeight/720)})`;addEventListener('resize',fit);fit();let paused=matchMedia('(prefers-reduced-motion:reduce)').matches;window.pause=()=>paused=true;window.renderAt=t=>{prism.style.transform=`translateY(${Math.sin(t*.7)*15}px) rotate(${Math.sin(t*.35)*4}deg) scale(${1+.02*Math.sin(t*.4)})`;copy.style.opacity=Math.max(0,Math.min(1,t/.7));};let start=performance.now();function loop(n){if(!paused)renderAt((n-start)/1000%8);requestAnimationFrame(loop)}renderAt(paused?3:0);requestAnimationFrame(loop);</script></html>
